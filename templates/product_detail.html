{% extends 'index.html' %}

{% block section %}

<link rel="stylesheet" href="{{ url_for('static', filename='css/product_detail.css') }}">
<script src="{{ url_for('static', filename='main.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/product_detail.js') }}" defer></script>

{% include 'common/header.html' %}

<main class="page-background product-detail-page">
  <section class="product-detail-container">

    <!-- 왼쪽: 상품 이미지 영역 -->
    <div class="product-detail-image">
      <div class="image-count">
        <span id="imageCount">1/3</span>
      </div>

      <div class="product-image">
        <img id="productMainImage" src="{{ url_for('static', filename='images/' ~ img_path) }}" alt="상품 이미지">
      </div>

      <!-- 이미지 이동 버튼 -->
      <div class="image-navigation">
        <button type="button" class="image-prev">
          &#10094;
        </button>

        <button type="button" class="image-next">
          &#10095;
        </button>
      </div>

    </div>

    <!-- 오른쪽: 상품 정보 영역 -->
    <div class="product-detail-info">

      <!-- 상품명 -->
      <div class="product-detail-header">
        <h1 class="product-title">{{ name }}</h1>
      </div>

      <!-- 판매자 및 주소 -->
      <div class="product-seller-info">

        <div class="seller-item">
          <span class="seller-label">판매자</span>
          <span class="seller-name">@{{ data.seller_id }}</span>
        </div>

        <div class="seller-item">
          <span class="seller-label">주소</span>
          <span class="seller-address">{{ data.address }}</span>
        </div>

      </div>

      <!-- 가격 및 상품 상태 -->
      <div class="product-price-section">

        <span class="product-price">₩ {{ "{:,}".format(data.price) }}</span>
        <span class="product-status">상태 | {{ data.status }}</span>

      </div>

      <!-- 상품 설명 -->
      <div class="product-description-section">

        <p class="product-description"> {{ data.description or "" }}</p>
    </div>

      <!-- 버튼 영역 -->
      <div class="product-detail-actions">
        <button type="button" class="btn btn--primary" id="buyBtn"
          data-logged-in="{{ 'true' if logged_in else 'false' }}"
          data-name="{{ name }}"
          {% if sold %}disabled{% endif %}>
        {{ '구매완료' if sold else '구매하기' }}
        </button>
        <button type="button" class="btn btn--secondary" id="backBtn">뒤로가기</button>
      </div>

      </div>

  </section>
</main>

{% include 'common/footer.html' %}

{% endblock section %}
