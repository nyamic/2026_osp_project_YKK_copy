{% extends "index.html" %}

{% block section %}

<link rel="stylesheet" href="#">
<script src="#" defer></script>

{% include 'common/header.html' %}

<main class="page-background product-detail-page">
  <section class="product-detail-container">

    <!-- 상품 이미지 영역 -->
    <div class="product-detail-image">
      <div class="image-count">
        <span id="imageCount">1/3</span>
      </div>

      <div class="product-image">
        <img id="productMainImage" src="{{ url_for('static', filename='images/calculate.png') }}" alt="카시오 공학용 계산기">
      </div>

      <!-- 이미지 이동 버튼 -->
      <div class="image-navigation">
        <button type="button" class="image-prev">
          &#10094;
        </button>

        <button type="button" class="image-next">
          &#10095;
        </button>
      </div>

    </div>

    <!-- 오른쪽: 상품 정보 영역 -->
    <div class="product-detail-info">

      <!-- 상품명 -->
      <div class="product-detail-header">
        <h1 class="product-title">
          카시오 공학용 계산기<br>나눔합니다!
        </h1>
      </div>

      <!-- 판매자 및 나눔장소 -->
      <div class="product-seller-info">

        <div class="seller-item">
          <span class="seller-label">판매자</span>
          <span class="seller-name">@ykk_osp</span>
        </div>

        <div class="seller-item">
          <span class="seller-label">나눔장소</span>
          <span class="seller-address">아산공학관 121호</span>
        </div>

      </div>

      <!-- 상품 설명 -->
      <div class="product-description-section">

        <p class="product-description">
          시험 때문에 급하게 구매하였는데, 쓸 일이 없어져서 나눔합니다.
          몇 번 사용하지 않아 사용감은 없습니다.
          모델은 카시오 공학용 계산기 fx-570es입니다.
        </p>
      </div>

      <!-- 버튼 영역 -->
      <div class="product-detail-actions">

        <button type="button" class="btn btn--primary">
          나눔받기
        </button>

        <button type="button" class="btn btn--secondary">
          뒤로가기
        </button>

      </div>

    </div>
  </section>
</main>

{% include 'common/footer.html' %}

{% endblock section %}
