<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>상품 목록 | EWHA MARKET</title>
  <link rel="stylesheet" href="/static/css/wishlist.css" />
</head>
<body>

    {% include 'common/header.html' %}

  <main class="product-page">
    <!-- 장식 이미지 (좌/우) : 이미지 경로는 본인 파일에 맞게 수정 -->
    <img class="deco deco-left-heart" src="images/deco-heart.png" alt="" />
    <img class="deco deco-left-dash" src="images/deco-dash.png" alt="" />
    <img class="deco deco-right-heart" src="images/deco-heart-spark.png" alt="" />
    <img class="deco deco-right-wave" src="images/deco-wave.png" alt="" />

    <div class="container">
      <!-- 필터 -->
      <form class="filter-bar" id="filterForm">
        <select name="sort" aria-label="정렬">
          <option value="" selected disabled hidden>정렬</option>
          <option value="latest">최신순</option>
          <option value="price-asc">낮은 가격순</option>
          <option value="price-desc">높은 가격순</option>
        </select>

        <select name="category" aria-label="카테고리">
          <option value="" selected disabled hidden>카테고리</option>
          <option value="pen">필기구</option>
          <option value="note">노트/종이</option>
          <option value="office">사무용품</option>
          <option value="etc">기타</option>
        </select>

        <select name="price" aria-label="가격">
          <option value="" selected disabled hidden>가격</option>
          <option value="0-1000">~ 1,000원</option>
          <option value="1000-5000">1,000 ~ 5,000원</option>
          <option value="5000-10000">5,000 ~ 10,000원</option>
          <option value="10000-">10,000원 이상</option>
        </select>

        <select name="status" aria-label="상태">
          <option value="" selected disabled hidden>상태</option>
          <option value="new">새 상품</option>
          <option value="used">중고</option>
        </select>

        <select name="location" aria-label="거래위치">
          <option value="" selected disabled hidden>거래위치</option>
          <option value="campus">공대</option>
          <option value="station">학관</option>
          <option value="delivery">ECC</option>
        </select>
      </form>

      <!-- 상품 목록 -->
      <ul class="product-grid">
        <li class="product-card">
          <a href="#">
            <div class="thumb"><img src="/static/images/chikawa.png" alt="먼작귀 치이카와 샤프" /></div>
            <p class="name">먼작귀 치이카와 샤프</p>
            <p class="price">₩ 10,500</p>
          </a>
        </li>

        <li class="product-card">
          <a href="#">
            <div class="thumb"><img src="/static/images/staedler.png" alt="스테들러 슬라이딩 지우개" /></div>
            <p class="name">스테들러 슬라이딩 지우개</p>
            <p class="price">₩ 1,650</p>
          </a>
        </li>

        <li class="product-card">
          <a href="#">
            <div class="thumb"><img src="/static/images/dokdo.png" alt="독도 연필세트 B 8자루입" /></div>
            <p class="name">독도 연필세트 B 8자루입</p>
            <p class="price">₩ 2,000</p>
          </a>
        </li>

        <li class="product-card">
          <a href="#">
            <div class="thumb"><img src="/static/images/product1.jpg" alt="소프트 파스텔 형광펜 4색 세트" /></div>
            <p class="name">소프트 파스텔 형광펜 4색 세트</p>
            <p class="price">₩ 5,000</p>
          </a>
        </li>

        <li class="product-card">
          <a href="#">
            <div class="thumb"><img src="/static/images/springnote.png" alt="모닝글로리 대용량 무지 연습장" /></div>
            <p class="name">모닝글로리 대용량 무지 연습장</p>
            <p class="price">₩ 2,000</p>
          </a>
        </li>

        <li class="product-card">
          <a href="#">
            <div class="thumb"><img src="/static/images/earthcolorpen.png" alt="[지구과학] 슈퍼색연필 12색" /></div>
            <p class="name">[지구과학] 슈퍼색연필 12색</p>
            <p class="price">₩ 3,000</p>
          </a>
        </li>
      </ul>

      <!-- 페이지네이션 -->
      <nav class="pagination" aria-label="페이지 이동">
        <a href="#" class="page-btn arrow" aria-label="이전">&lt;</a>
        <a href="#" class="page-btn active" aria-current="page">1</a>
        <a href="#" class="page-btn">2</a>
        <a href="#" class="page-btn">3</a>
        <a href="#" class="page-btn arrow" aria-label="다음">&gt;</a>
      </nav>
    </div>
  </main>

</body>

{% include 'common/footer.html' %}

</html>
