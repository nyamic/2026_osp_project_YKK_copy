{% extends "index.html" %}

{% block section %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

<main class="auth-page">
  <!-- 로고 -->
  <div class="auth-logo">
    <a href="{{ url_for('main_page') }}">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="EWHA MARKET 로고">
    </a>
  </div>

  <!-- 로그인 / 회원가입 탭 -->
  <div class="auth-tabs">
    <a href="{{ url_for('login') }}" class="auth-tab active">로그인</a>
    <a href="{{ url_for('signup') }}" class="auth-tab">회원가입</a>
  </div>

  <!-- 로그인 폼 -->
  <section class="auth-container login-container">
    <form class="auth-form" action="/login" method="POST">
      <div class="auth-input-list">
        <div class="auth-input-group">
          <label for="login-id" class="auth-label">아이디</label>
          <input
            type="text"
            id="login-id"
            name="id"
            class="auth-input"
            required
          >
        </div>

        <div class="auth-input-group">
          <label for="login-password" class="auth-label">비밀번호</label>
          <input
            type="password"
            id="login-password"
            name="pw"
            class="auth-input"
            required
          >
        </div>

      </div>

      <!-- 버튼 -->
      <div class="auth-button-group">
        <button type="submit" class="auth-submit-button">
          로그인
        </button>

        <button type="reset" class="auth-cancel-button">
          취소
        </button>
      </div>

    </form>

  </section>

</main>

{% include 'common/footer.html' %}

{% endblock section %}
